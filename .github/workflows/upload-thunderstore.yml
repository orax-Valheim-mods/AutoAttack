name: Upload release to Thunderstore

# Publishes the release zip asset to Thunderstore using the community action.
# Setup (one-off):
#   gh variable set THUNDERSTORE_NAMESPACE --body 'orax'    -R <owner>/<repo>
#   gh variable set THUNDERSTORE_COMMUNITY  --body 'valheim' -R <owner>/<repo>
#   gh secret set THUNDERSTORE_API_TOKEN                    -R <owner>/<repo>
#
# The version is taken from the release tag (v0.1.0 -> 0.1.0).
# The release asset must be a valid Thunderstore package (manifest.json, icon.png,
# README.md, plugins/ at root) — this is what the mod's Release packaging produces.
on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

env:
  ASSET: "AutoAttack.zip"

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        run: |
          missing=0
          if [ -z "${{ vars.THUNDERSTORE_NAMESPACE }}" ]; then
            echo "::error::Repository variable THUNDERSTORE_NAMESPACE is not set (gh variable set THUNDERSTORE_NAMESPACE --body 'orax')"
            missing=1
          fi
          if [ -z "${{ vars.THUNDERSTORE_COMMUNITY }}" ]; then
            echo "::error::Repository variable THUNDERSTORE_COMMUNITY is not set (gh variable set THUNDERSTORE_COMMUNITY --body 'valheim')"
            missing=1
          fi
          if [ -z "${{ secrets.THUNDERSTORE_API_TOKEN }}" ]; then
            echo "::error::Secret THUNDERSTORE_API_TOKEN is not set (gh secret set THUNDERSTORE_API_TOKEN)"
            missing=1
          fi
          exit $missing

      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$INPUT_TAG"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No tag to publish"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Derive the version from the tag
        id: meta
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download the release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern "$ASSET" --dir dist
          ls -l dist

      - name: Publish to Thunderstore
        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          token: ${{ secrets.THUNDERSTORE_API_TOKEN }}
          namespace: ${{ vars.THUNDERSTORE_NAMESPACE }}
          community: ${{ vars.THUNDERSTORE_COMMUNITY }}
          name: AutoAttack
          version: ${{ steps.meta.outputs.version }}
          file: dist/${{ env.ASSET }}
          # TEST config: publish to thunderstore.dev with community riskofrain2.
          # REMOVE these two lines (and use a thunderstore.io token) for production.
          dev: true
          categories: Mods
